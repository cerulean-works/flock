# 750M 524k edge-rule rung (Muon 3e-3): 16 GB200 x 32768 tokens (same 524k global batch; 16 GPUs for speed). Written 11-25 09:3x.
sweep:
  name: llama750m-bs524k-lo
  output_root: /work/u4982363/sweeps
  gpus_per_run: 16
  master_port: 32700
  name_template: llama750m-bs524k-lo-b2{optimizer.betas}-mlr{optimizer.muon_lr}-alr{optimizer.lr}-s{seed}
  runs:
  - optimizer.muon_lr: 0.003
    optimizer.lr: 0.003
    optimizer.betas:
    - 0.9
    - 0.99
    seed: 0
base:
  seed: 0
  data:
    text_path: /work/u4982363/datasets/mix-200b-tc114b-en86b-seed0
    text_version: 1
    block_rows: 2048
    add_bos: true
    add_eos: true
    chunk_length: 4096
  model:
    preset: llama3.2-200m
    attn_implementation: flash_attention_4
    overrides:
      hidden_size: 1280
      intermediate_size: 5120
      num_hidden_layers: 24
      num_attention_heads: 20
      num_key_value_heads: 4
  optimizer:
    type: muon_adamw
    lr: 0.003
    betas:
    - 0.9
    - 0.99
    muon_lr: 0.006
  schedule:
  - start: 0
    end: 0.01
    start_ratio: 0.0
    end_ratio: 1.0
  - start: 0.01
    end: 0.8
    start_ratio: 1.0
    end_ratio: 1.0
  - start: 0.8
    end: 1.0
    start_ratio: 1.0
    end_ratio: 0.0
    interpolation: linear
  trainer:
    batch_tokens: 32768
    torch_compile: true
    dataloader_num_workers: 8
    dataloader_prefetch_factor: 8
    logging_steps: 10
    save_steps: 10000000
    wandb_project: scaling-law-pilot
  stop_tokens: 15B
  save_tokens:
  - 3B
  - 6B
  - 9B
  - 12B
