# Smoke: 100m on 1 GPU(s) x 65536 tokens, 150M tokens: memory, throughput, launch path.
sweep:
  name: smoke-llama100m-1x65k
  output_root: /work/u4982363/sweeps
  gpus_per_run: 1
  master_port: 30800
  name_template: smoke-llama100m-1x65k-b2{optimizer.betas}-mlr{optimizer.muon_lr}-alr{optimizer.lr}-s{seed}
  runs:
  - optimizer.muon_lr: 0.003
    optimizer.lr: 0.003
    optimizer.betas: [0.9, 0.99]
    seed: 0
base:
  seed: 0
  data: {text_path: /work/u4982363/datasets/mix-200b-tc114b-en86b-seed0, text_version: 1,
    block_rows: 2048, add_bos: true, add_eos: true, chunk_length: 4096}
  model:
    preset: llama3.2-200m
    attn_implementation: flash_attention_4
    overrides: {hidden_size: 512, intermediate_size: 2048, num_hidden_layers: 9, num_attention_heads: 8,
      num_key_value_heads: 2}
  optimizer:
    type: muon_adamw
    lr: 0.003
    betas: [0.9, 0.99]
    muon_lr: 0.003
  schedule:
  - {start: 0, end: 0.01, start_ratio: 0.0, end_ratio: 1.0}
  - {start: 0.01, end: 0.8, start_ratio: 1.0, end_ratio: 1.0}
  - {start: 0.8, end: 1.0, start_ratio: 1.0, end_ratio: 0.0, interpolation: linear}
  trainer: {batch_tokens: 65536, torch_compile: true, dataloader_num_workers: 4, dataloader_prefetch_factor: 8,
    logging_steps: 10, save_steps: 100, wandb_project: scaling-law-pilot-smoketest}
  stop_tokens: 150M
  save_tokens: [50M]
