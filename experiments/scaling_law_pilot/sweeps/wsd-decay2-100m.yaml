# WSD decay branches, 100m, T in [400, 1600] tok/param, seeds 0 and 1: each
# resumes its main run's 0.9 T save and cosine-decays to 1% of peak at T.
sweep:
  name: wsd-decay2-100m
  output_root: /work/u4982363/sweeps
  gpus_per_run: 8
  master_port: 31400
  name_template: wsd100m-s{seed}-to{stop_tokens}
  runs:
  - seed: 0
    stop_tokens: 40B
    save_tokens: &id001 [38380000000]
    branch_from: /work/u4982363/sweeps/wsd-100m/runs/wsd100m-s0/checkpoints/checkpoint-137329
  - seed: 1
    stop_tokens: 40B
    save_tokens: *id001
    branch_from: /work/u4982363/sweeps/wsd-100m/runs/wsd100m-s1/checkpoints/checkpoint-137329
  - seed: 0
    stop_tokens: 80B
    save_tokens: &id002 [76760000000]
    branch_from: /work/u4982363/sweeps/wsd-100m/runs/wsd100m-s0/checkpoints/checkpoint-274658
  - seed: 1
    stop_tokens: 80B
    save_tokens: *id002
    branch_from: /work/u4982363/sweeps/wsd-100m/runs/wsd100m-s1/checkpoints/checkpoint-274658
  - seed: 0
    stop_tokens: 120B
    save_tokens: &id003 [115140000000]
    branch_from: /work/u4982363/sweeps/wsd-100m/runs/wsd100m-s0/checkpoints/checkpoint-411987
  - seed: 1
    stop_tokens: 120B
    save_tokens: *id003
    branch_from: /work/u4982363/sweeps/wsd-100m/runs/wsd100m-s1/checkpoints/checkpoint-411987
  - seed: 0
    stop_tokens: 160B
    save_tokens: &id004 [153520000000]
    branch_from: /work/u4982363/sweeps/wsd-100m/runs/wsd100m-s0/checkpoints/checkpoint-549316
  - seed: 1
    stop_tokens: 160B
    save_tokens: *id004
    branch_from: /work/u4982363/sweeps/wsd-100m/runs/wsd100m-s1/checkpoints/checkpoint-549316
base:
  seed: 0
  data: {text_path: /work/u4982363/datasets/mix-200b-tc114b-en86b-seed0, text_version: 1, block_rows: 2048,
    add_bos: true, add_eos: true, chunk_length: 4096}
  model:
    preset: llama3.2-200m
    attn_implementation: flash_attention_4
    overrides: {hidden_size: 512, intermediate_size: 2048, num_hidden_layers: 9, num_attention_heads: 8,
      num_key_value_heads: 2}
  optimizer:
    type: muon_adamw
    lr: 0.006
    betas: [0.9, 0.99]
    muon_lr: 0.004
  wsd: {warmup_tokens: 100000000, decay_fraction: 0.1, final_ratio: 0.01, decay: cosine}
  trainer: {batch_tokens: 32768, torch_compile: true, dataloader_num_workers: 4, dataloader_prefetch_factor: 8,
    logging_steps: 10, wandb_project: scaling-law-wsd}
  token_rounding: nearest
  one_pass_tokens: 191900000000
  nominal_params: 100000000
  save_evals:
    suites: {paloma: paloma, tw_text: tw_text_v0}
  stop_tokens: 40B
