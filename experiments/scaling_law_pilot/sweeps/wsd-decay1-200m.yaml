# WSD decay branches, 200m, T in [10, 120] tok/param, seeds 0 and 1: each
# resumes its main run's 0.9 T save and cosine-decays to 1% of peak at T.
sweep:
  name: wsd-decay1-200m
  output_root: /work/u4982363/sweeps
  gpus_per_run: 8
  master_port: 31300
  name_template: wsd200m-s{seed}-to{stop_tokens}
  runs:
  - seed: 0
    stop_tokens: 2B
    save_tokens: &id001 []
    branch_from: /work/u4982363/sweeps/wsd-200m/runs/wsd200m-s0/checkpoints/checkpoint-4578
  - seed: 1
    stop_tokens: 2B
    save_tokens: *id001
    branch_from: /work/u4982363/sweeps/wsd-200m/runs/wsd200m-s1/checkpoints/checkpoint-4578
  - seed: 0
    stop_tokens: 3B
    save_tokens: &id002 []
    branch_from: /work/u4982363/sweeps/wsd-200m/runs/wsd200m-s0/checkpoints/checkpoint-6866
  - seed: 1
    stop_tokens: 3B
    save_tokens: *id002
    branch_from: /work/u4982363/sweeps/wsd-200m/runs/wsd200m-s1/checkpoints/checkpoint-6866
  - seed: 0
    stop_tokens: 4B
    save_tokens: &id003 []
    branch_from: /work/u4982363/sweeps/wsd-200m/runs/wsd200m-s0/checkpoints/checkpoint-9155
  - seed: 1
    stop_tokens: 4B
    save_tokens: *id003
    branch_from: /work/u4982363/sweeps/wsd-200m/runs/wsd200m-s1/checkpoints/checkpoint-9155
  - seed: 0
    stop_tokens: 8B
    save_tokens: &id004 []
    branch_from: /work/u4982363/sweeps/wsd-200m/runs/wsd200m-s0/checkpoints/checkpoint-18311
  - seed: 1
    stop_tokens: 8B
