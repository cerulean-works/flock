    branch_from: /work/u4982363/sweeps/wsd-200m/runs/wsd200m-s1/checkpoints/checkpoint-18311
  - seed: 0
    stop_tokens: 16B
    save_tokens: &id005 []
    branch_from: /work/u4982363/sweeps/wsd-200m/runs/wsd200m-s0/checkpoints/checkpoint-36621
  - seed: 1
    stop_tokens: 16B
    save_tokens: *id005
    branch_from: /work/u4982363/sweeps/wsd-200m/runs/wsd200m-s1/checkpoints/checkpoint-36621
  - seed: 0
