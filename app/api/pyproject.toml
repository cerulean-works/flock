[project]
name = "flock-app-api"
version = "0.1.0"
requires-python = ">=3.14"
# The API runs flock.hub from source (see Dockerfile), so it lists flock.hub's dependencies
# itself rather than depending on the `flock` package, which would bring torch into the image.
dependencies = [
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "datasets>=5.1.0",
    "fastapi>=0.143.3",
    "fastapi-cli>=0.0.32",
    "httptools>=0.9.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "numpy>=2.5.4",
    "orjson>=3.13.0",
    "pyarrow>=26.0.0",
    "pyjwt>=2.10.1",
    "pylance>=14.0.0",
    "uvicorn>=0.54.0",
    "uvloop>=0.23.0",
    "modal>=1.5.2",
]

[tool.uv]
package = false
