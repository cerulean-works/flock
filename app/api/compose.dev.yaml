name: flock-app

services:
  api:
    image: flock-api:${FLOCK_VERSION:-latest}
    build:
      context: ../..
      dockerfile: app/api/Dockerfile
    environment:
      FLOCK_DATABASE_URL: postgresql://flock:${POSTGRES_PASSWORD:-flock}@postgres:5432/flock
      FLOCK_WEB_URL: ${FLOCK_WEB_URL:-http://localhost:5173}
      FLOCK_API_PUBLIC_URL: ${FLOCK_API_PUBLIC_URL:-http://localhost:8080}
      FLOCK_MIGRATE_ON_STARTUP: ${FLOCK_MIGRATE_ON_STARTUP:-}
      FLOCK_JWT_SECRET: ${FLOCK_JWT_SECRET:-}
      FLOCK_ACCESS_TOKEN_TTL: ${FLOCK_ACCESS_TOKEN_TTL:-}
      FLOCK_REFRESH_TOKEN_TTL: ${FLOCK_REFRESH_TOKEN_TTL:-}
      FLOCK_INVITE_TTL: ${FLOCK_INVITE_TTL:-}
      FLOCK_RESET_TTL: ${FLOCK_RESET_TTL:-}
      FLOCK_GOOGLE_CLIENT_ID: ${FLOCK_GOOGLE_CLIENT_ID:-}
      FLOCK_GOOGLE_CLIENT_SECRET: ${FLOCK_GOOGLE_CLIENT_SECRET:-}
      FLOCK_GOOGLE_REDIRECT_URL: ${FLOCK_GOOGLE_REDIRECT_URL:-}
      FLOCK_GRAVATAR: ${FLOCK_GRAVATAR:-}
      FLOCK_GRAVATAR_URL: ${FLOCK_GRAVATAR_URL:-}
      FLOCK_WANDB_BASE_URL: ${FLOCK_WANDB_BASE_URL:-}
      FLOCK_HUB_S3_ENDPOINT: ${FLOCK_HUB_S3_ENDPOINT:-}
      FLOCK_HUB_S3_REGION: ${FLOCK_HUB_S3_REGION:-}
      FLOCK_HUB_S3_ACCESS_KEY_ID: ${FLOCK_HUB_S3_ACCESS_KEY_ID:-}
      FLOCK_HUB_S3_SECRET_ACCESS_KEY: ${FLOCK_HUB_S3_SECRET_ACCESS_KEY:-}
      FLOCK_HUB_BUCKET: ${FLOCK_HUB_BUCKET:-}
      FLOCK_HUB_PROXY_URL: ${FLOCK_HUB_PROXY_URL:-}
      FLOCK_HUB_PROXY_PUBLIC_URL: ${FLOCK_HUB_PROXY_PUBLIC_URL:-}
      FLOCK_HUB_CREDENTIALS_TTL: ${FLOCK_HUB_CREDENTIALS_TTL:-}
      FLOCK_HUB_MIRROR_ORG: ${FLOCK_HUB_MIRROR_ORG:-}
      FLOCK_HUB_AUTO_IMPORT_MAX_BYTES: ${FLOCK_HUB_AUTO_IMPORT_MAX_BYTES:-}
      FLOCK_HUB_HF_TOKEN: ${FLOCK_HUB_HF_TOKEN:-}
      FLOCK_HISTORY_CACHE_POINTS: ${FLOCK_HISTORY_CACHE_POINTS:-}
      FLOCK_CRASH_TIMEOUT: ${FLOCK_CRASH_TIMEOUT:-}
      FLOCK_POOL_SIZE: ${FLOCK_POOL_SIZE:-}
      FLOCK_CORS_ORIGINS: ${FLOCK_CORS_ORIGINS:-}
      FLOCK_LOG_LEVEL: ${FLOCK_LOG_LEVEL:-}
    ports:
      - 8080:8080
    volumes:
      - files:/data/files
    depends_on:
      postgres:
        condition: service_healthy
    # Exactly one replica: the server keeps its working set in memory and holds a database
    # lock, so a second instance would refuse to start.
    restart: unless-stopped
    stop_grace_period: 15s

  # The hub's S3 proxy; start it with `--profile hub` once FLOCK_HUB_S3_* are set.
  hub-s3:
    image: flock-api:${FLOCK_VERSION:-latest}
    command: ["uvicorn", "app.api.src.hub_proxy.app:app", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      FLOCK_DATABASE_URL: postgresql://flock:${POSTGRES_PASSWORD:-flock}@postgres:5432/flock
      FLOCK_HUB_S3_ENDPOINT: ${FLOCK_HUB_S3_ENDPOINT:-}
      FLOCK_HUB_S3_REGION: ${FLOCK_HUB_S3_REGION:-}
      FLOCK_HUB_S3_ACCESS_KEY_ID: ${FLOCK_HUB_S3_ACCESS_KEY_ID:-}
      FLOCK_HUB_S3_SECRET_ACCESS_KEY: ${FLOCK_HUB_S3_SECRET_ACCESS_KEY:-}
      FLOCK_HUB_BUCKET: ${FLOCK_HUB_BUCKET:-}
      FLOCK_HUB_MIRROR_ORG: ${FLOCK_HUB_MIRROR_ORG:-}
      FLOCK_POOL_SIZE: ${FLOCK_POOL_SIZE:-}
      FLOCK_LOG_LEVEL: ${FLOCK_LOG_LEVEL:-}
    ports:
      - 9000:9000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 30s
    depends_on:
      api:  # applies the migrations the proxy reads
        condition: service_healthy
    profiles: [hub]
    restart: unless-stopped

  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: flock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flock}
      POSTGRES_DB: flock
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - max_wal_size=4GB
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flock -d flock"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
  files:
