name: flock-tracker

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracker}
      POSTGRES_DB: tracker
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - max_wal_size=4GB
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  tracker:
    image: flock-tracker:${TRACKER_VERSION:-latest}
    build:
      context: .
      # Dependencies resolve through the workspace's uv.lock at the repository root.
      additional_contexts:
        workspace: ../..
    environment:
      TRACKER_DATABASE_URL: postgresql://tracker:${POSTGRES_PASSWORD:-tracker}@postgres:5432/tracker
      TRACKER_LOG_LEVEL: ${TRACKER_LOG_LEVEL:-info}
      TRACKER_DEFAULT_ENTITY: ${TRACKER_DEFAULT_ENTITY:-flock}
      TRACKER_PUBLIC_URL: ${TRACKER_PUBLIC_URL:-}
      # Where the dashboard (flock-ui) is; its `pnpm dev` server by default.
      TRACKER_APP_URL: ${TRACKER_APP_URL:-http://localhost:5173}
      TRACKER_JWT_SECRET: ${TRACKER_JWT_SECRET:-}
      TRACKER_GOOGLE_CLIENT_ID: ${TRACKER_GOOGLE_CLIENT_ID:-}
      TRACKER_GOOGLE_CLIENT_SECRET: ${TRACKER_GOOGLE_CLIENT_SECRET:-}
      TRACKER_GOOGLE_REDIRECT_URL: ${TRACKER_GOOGLE_REDIRECT_URL:-}
      TRACKER_CRASH_TIMEOUT: ${TRACKER_CRASH_TIMEOUT:-600}
      TRACKER_HISTORY_CACHE_POINTS: ${TRACKER_HISTORY_CACHE_POINTS:-20000000}
    ports:
      - "${TRACKER_PORT:-8080}:8080"
    volumes:
      - tracker-files:/data/files
    depends_on:
      postgres:
        condition: service_healthy
    # Exactly one replica: the server keeps its working set in memory and holds a database
    # lock, so a second instance would refuse to start.
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  postgres-data:
  tracker-files:
