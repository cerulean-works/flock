[project]
name = "flock-hub"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "datasets>=5.1.0",
    "flock",
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "pyarrow>=26.0.0",
    "pylance>=13.0.0",
    "pyyaml>=6.0.3",
    "zstandard>=0.25.0",
]

[project.scripts]
flock-hub = "flock.hub.cli:main"

[tool.uv]
package = false
