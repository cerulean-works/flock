[project]
name = "flock-hub"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.1.0",
    "flock",
    "pyarrow>=26.0.0",
    "pylance>=14.0.0",
]

[project.optional-dependencies]
models = [
    "boto3>=1.43.118",
    "safetensors>=0.8.0",
    "torch>=2.14.1",
]

[tool.uv]
package = false
