[project]
name = "flock"
version = "0.1.0"
description = "Cerulean's monorepo for model training, evaluation, and development tooling."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
flock = "flock.cli.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = ["flock.cli", "flock.eval", "flock.hub", "flock.training", "app.api"]
wheel-exclude = ["pyproject.toml"]

[tool.uv]
default-groups = ["dev", "components", "gpu"]
conflicts = [[{ group = "cpu-tests" }, { group = "gpu" }]]

[tool.uv.workspace]
members = ["flock/cli", "flock/eval", "flock/hub", "flock/training", "app/api", "tests"]

[tool.uv.sources]
flock = { workspace = true }
flock-cli = { workspace = true }
flock-eval = { workspace = true }
flock-hub = { workspace=true }
flock-training = { workspace = true }
torch = { index = "pytorch-cpu", group = "cpu-tests", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["flock", "src", "app", "scripts"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "latency: tests that measure app response latency",
]
addopts = ["--import-mode=importlib", "--strict-markers", "-m", "not latency", "-n", "auto", "--dist=loadgroup"]

[dependency-groups]
components = [
    "flock-cli",
    "flock-eval",
    "flock-hub",
    "flock-training",
]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]
cpu-tests = ["torch==2.14.1"]
gpu = ["torch>=2.14.1"]
