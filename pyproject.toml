[project]
name = "flock"
version = "0.1.0"
description = "Cerulean's monorepo for model training, evaluation, and development tooling."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = ["flock.eval", "flock.hub", "flock.training"]
wheel-exclude = ["pyproject.toml"]

[tool.uv]
default-groups = ["dev", "components"]

[tool.uv.workspace]
members = ["flock/eval", "flock/hub", "flock/training", "flock/tracker", "tests"]

[tool.uv.sources]
flock = { workspace = true }
flock-eval = { workspace = true }
flock-hub = { workspace = true }
flock-training = { workspace = true }
flock-tracker = { workspace = true }

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
ignore = []

[tool.ruff.lint.isort]
# The tracker is an app (flock/tracker/app.py + src/), imported from its own directory.
known-first-party = ["flock", "src", "app", "scripts"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
# The tracker's tests import its app and src package the way `fastapi run` does.
pythonpath = ["flock/tracker"]

[tool.ty.environment]
extra-paths = ["flock/tracker"]

[dependency-groups]
components = [
    "flock-eval",
    "flock-hub",
    "flock-training",
    "flock-tracker",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]
