name: Publish images

# Builds flock-api and flock-ui from the latest commit on main, pushes them to GHCR tagged with
# the commit SHA, moves the `main` tag to them, then calls Dokploy's deploy webhook (D141). The
# stack pulls `main`, and `docker stack deploy` resolves it to a digest on every deploy, so a
# moved tag is an update and a rollback returns to the digest that ran before.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Only the latest commit is built: a push cancels the run still building an older one, which
# then never moves `main` or deploys.
concurrency:
  group: publish-images
  cancel-in-progress: true

jobs:
  publish:
    name: Build, push and deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      # An empty build argument would bake an empty dashboard origin into flock-ui.
      - name: Check the dashboard origin is set
        env:
          FLOCK_WEB_URL: ${{ vars.FLOCK_WEB_URL }}
        run: |
          if [ -z "$FLOCK_WEB_URL" ]; then
            echo "Set the repository variable FLOCK_WEB_URL to the dashboard's public origin." >&2
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Sign in to GHCR
        uses: docker/login-action@v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push flock-api
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: app/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/flock-api:${{ github.sha }}
          cache-from: type=gha,scope=flock-api
          cache-to: type=gha,mode=max,scope=flock-api

      - name: Build and push flock-ui
        uses: docker/build-push-action@v6.18.0
        with:
          context: app/web
          push: true
          # The dashboard's public origin is baked into the image.
          build-args: |
            FLOCK_WEB_URL=${{ vars.FLOCK_WEB_URL }}
          tags: ghcr.io/${{ github.repository_owner }}/flock-ui:${{ github.sha }}
          cache-from: type=gha,scope=flock-ui
          cache-to: type=gha,mode=max,scope=flock-ui

      # `main` moves only once both images are pushed, so the stack never pulls an API and a
      # dashboard from different commits.
      - name: Move the main tag
        env:
          IMAGES: ghcr.io/${{ github.repository_owner }}
        run: |
          for image in flock-api flock-ui; do
            docker buildx imagetools create -t "$IMAGES/$image:main" "$IMAGES/$image:$GITHUB_SHA"
          done

      # Dokploy checks the branch of a GitHub-sourced service against the push it's sent, so the
      # call looks like one. Skipped until the secret is set.
      - name: Deploy to Dokploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
          MESSAGE: ${{ github.event.head_commit.message || 'Publish images' }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "DOKPLOY_WEBHOOK_URL isn't set, so nothing is deployed."
            exit 0
          fi
          set -euo pipefail
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          # Dokploy refuses with a 301 status (not a redirect) when the branch doesn't match.
          status=$(jq -n --arg sha "$GITHUB_SHA" --arg message "$MESSAGE" \
            '{ref: "refs/heads/main", head_commit: {id: $sha, message: ($message | split("\n")[0])}}' |
            curl --silent --show-error --output "$body" --write-out '%{http_code}' \
              -H "x-github-event: push" -H "Content-Type: application/json" \
              --data @- "$DOKPLOY_WEBHOOK_URL")
          if [ "$status" != 200 ]; then
            echo "Dokploy answered $status: $(cat "$body")" >&2
            exit 1
          fi
          echo "Deploying $GITHUB_SHA."
