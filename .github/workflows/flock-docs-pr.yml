name: Flock docs PR build

# Builds a pull request's flock docs without secrets; flock-docs-pr-publish.yml publishes
# the result to docs-preview.cerulean.works/flock/pr_<N>/.

on:
  pull_request:

permissions: {}

concurrency:
  group: flock-docs-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    uses: cerulean-works/doc-builder/.github/workflows/build_docs.yml@main
    permissions:
      contents: read
    with:
      project: flock
      path_to_docs: flock/docs/source
      python_version: "3.14"
      mock_deps: torch,transformers,huggingface_hub,datasets,tokenizers,wandb,httpx
