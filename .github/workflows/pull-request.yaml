name: Automatic Code Quality Tests

on:
  pull_request:

# The pytest job runs pull request code on our self-hosted runners (.github/runner/), so every job
# gets a read-only token. A new push cancels the run still testing the old one, to free the runners.
permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  Lint:
    name: Lint, Format and Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup Python
        run: uv python install

      - name: Install Dependencies
        run: uv sync --all-extras --all-packages --dev --no-group gpu --group cpu-tests --frozen

      - name: Run ruff's linter
        run: uv run --no-sync ruff check .

      - name: Run ruff's format checker
        run: uv run --no-sync ruff format --check .

      - name: Run ty
        run: uv run --no-sync ty check

  Tests:
    name: Run pytest suite
    runs-on: [self-hosted, flock-ci]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup Python
        run: uv python install

      - name: Install Dependencies
        run: uv sync --all-extras --all-packages --dev --no-group gpu --group cpu-tests --frozen

      - name: Run tests
        timeout-minutes: 10
        run: uv run --no-sync python -m pytest -q tests -n 6

  Snapshot:
    name: Eval task snapshot
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup Python
        run: uv python install

      - name: Install Dependencies
        run: uv sync --all-extras --all-packages --dev --no-group gpu --group cpu-tests --frozen

      - name: Check every task definition and toy request against the snapshot
        run: uv run --no-sync python -m pytest -q tests/eval/test_snapshot.py

  GPU:
    name: Run GPU tests on Modal
    runs-on: ubuntu-latest
    # Pull requests from forks get no secrets, so they cannot reach Modal.
    if: github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: gpu-tests-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup Python
        run: uv python install

      - name: Install Dependencies
        run: uv sync --only-dev --frozen

      - name: Run GPU tests on an H100
        run: uv run --no-sync modal run tests/modal_gpu.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
