name: Automatic Code Quality Tests

on:
  pull_request:

jobs:
  Lint:
    name: Lint, Format and Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup Python
        run: uv python install

      - name: Install Dependencies
        run: uv sync --all-extras --all-packages --dev --no-group gpu --group cpu-tests --frozen

      - name: Run ruff's linter
        run: uv run --no-sync ruff check .

      - name: Run ruff's format checker
        run: uv run --no-sync ruff format --check .

      - name: Run ty
        run: uv run --no-sync ty check

  Tests:
    name: Run pytest suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup Python
        run: uv python install

      - name: Install Dependencies
        run: uv sync --all-extras --all-packages --dev --no-group gpu --group cpu-tests --frozen

      - name: Run tests
        run: uv run --no-sync python -m pytest -q tests -n 6
