name: Flock docs

# Builds Flock's docs (app/api/docs/source) with doc-builder and publishes them to
# docs.cerulean.works/flock/. See
# https://docs.cerulean.works/doc-builder/latest/guide/publishing/

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Run by hand on main, or on a tag to rebuild that version.
  workflow_dispatch:

permissions: {}

# One run per ref at a time, in push order, so an older build never publishes over a newer one.
concurrency:
  group: flock-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: cerulean-works/doc-builder/.github/workflows/build_docs.yml@main
    permissions:
      contents: read
    with:
      project: flock
      # The build checks the repository out into a folder named after it.
      path_to_docs: flock/app/api/docs/source
      python_version: "3.14"
      # Autodoc imports flock.eval; its heavy dependencies are mocked instead of installed.
      mock_deps: torch,transformers,huggingface_hub,datasets,wandb

  publish:
    needs: build
    uses: cerulean-works/doc-builder/.github/workflows/publish_docs.yml@main
    # GitHub checks these against the preview jobs of publish_docs.yml even when they are skipped.
    # The production upload itself runs with no permissions.
    permissions:
      actions: read
      pull-requests: write
    with:
      project: flock
      environment: production
    secrets:
      r2_access_key_id: ${{ secrets.DOC_BUILDER_R2_ACCESS_KEY_ID }}
      r2_secret_access_key: ${{ secrets.DOC_BUILDER_R2_SECRET_ACCESS_KEY }}
      cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
